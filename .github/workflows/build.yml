# Builds LiteStep TNG and packages it: a portable zip and the installer.
#
#   push to master, pull request, manual run -> build + package, kept as an artifact
#   push of a tag "v<version>" (v0.26.0)     -> the same, published as a GitHub release
#
# What ships is decided in tools/package.ps1, which can be run locally the same way.
name: Build and package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the release for a tag

jobs:
  build:
    # Visual Studio 2022 (v143 toolset) and Inno Setup 6 come with this image.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild litestep.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo

      - name: Version
        id: version
        shell: pwsh
        run: |
          # A tag v1.2.3 is version 1.2.3; anything else is a development build.
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Inno Setup
        shell: pwsh
        run: |
          $present = (Get-Command iscc -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $present) { choco install innosetup -y --no-progress }

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./tools/package.ps1 -Version $env:VERSION -RepoUrl $env:REPO_URL

      - uses: actions/upload-artifact@v4
        with:
          name: LiteStepTNG-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          $flags = @('--title', "LiteStep TNG $env:VERSION", '--generate-notes')
          # 1.2.3-rc1 and the like are pre-releases.
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @files @flags
